name: CI — Build & Test

on:
  push:
    branches: [ master, 'features/**' ]
  pull_request:
    branches: [ master ]

# Least-privilege token. The job only reads the repo and uploads test
# results as workflow artifacts — neither requires write scopes.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.platform }})
    runs-on: windows-2022

    permissions:
      contents: read
      checks: write   # dorny/test-reporter publishes a check-run

    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123  # v4.0

      - name: Restore NuGet packages
        run: nuget restore tests\UnitTests\packages.config -PackagesDirectory packages

      - name: Build UnitTests
        run: |
          msbuild RFHUtil.sln /t:UnitTests `
            /p:Configuration=Debug `
            /p:Platform=${{ matrix.platform }} `
            /v:minimal

      - name: Run tests
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.platform }}' -eq 'x64') {
            'bin\tests\x64\UnitTests.exe'
          } else {
            'bin\tests\UnitTests.exe'
          }
          $xml = "test-results-${{ matrix.platform }}.xml"
          # UnitTests.exe is /SUBSYSTEM:WINDOWS (MFC), so & does not wait
          # and $LASTEXITCODE is unset. Start-Process -Wait gets the real
          # exit code from TerminateProcess() in TestMain.cpp.
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--gtest_output=xml:$xml" `
            -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Error "Tests failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.platform }}
          path: test-results-${{ matrix.platform }}.xml

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3.0.0
        if: always()
        with:
          name: Unit Tests (${{ matrix.platform }})
          path: test-results-${{ matrix.platform }}.xml
          reporter: java-junit
          fail-on-error: true
